{% extends "base.html" %}
{% block content %}
  <h2>Quiz — {{ tool.name }}</h2>
  <form method="post">
    {% for q in questions %}
      <div class="question">
        <p><strong>{{ loop.index }}. {{ q.text }}</strong></p>
        <label><input type="radio" name="q_{{ q.id }}" value="A" required> {{ q.option_a }}</label><br>
        <label><input type="radio" name="q_{{ q.id }}" value="B"> {{ q.option_b }}</label><br>
        {% if q.option_c %}<label><input type="radio" name="q_{{ q.id }}" value="C"> {{ q.option_c }}</label><br>{% endif %}
        {% if q.option_d %}<label><input type="radio" name="q_{{ q.id }}" value="D"> {{ q.option_d }}</label><br>{% endif %}
      </div>
      <hr>
    {% endfor %}
    <button type="submit">Submit Quiz</button>
  </form>
{% endblock %}
